[hh_ethnologue_comment]
comment = The report by **hh:w:Kurniawati:Air-Matoa** presents data on a (recently extinct) language called Air Matoa. The data was collected at Rurumo (formerly Kiruru) in Etna Bay, Kaimana regency, Papua, Indonesia and the Air Matoa are said to have relocated there in 1976 from an original location to the north. This language, which resembles no other language, has not been reported before and is missing from E16/E17/E18/E19/E20/E21/E22/E23/E24/E25/E26/E27/E28/E29.
