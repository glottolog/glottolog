comment = E16/E17/E18/E19/E20/E21/E22/E23/E24/E25/E26/E27/E28/E29 has two entries Mapidian [mpw] and Mawayana [mzx].
	Mapidian [mpw] is said to have the alternate names Mahuayana, Maiopitian, Maopityan, Mawayana and population 50 in Brazil (1986 Howard). Mawayana [mzx] is said to have the alternate names Mahuayana and population 50 (1986 C. Howard).
	
	
	As is evident, the two entries refer to the same group
	(**hh:hewsoc:Howard:Waiwai**), as comparison of data from both ethnonyms confirms
	(**hh:hew:Farabee:CArawaks**, **hh:hv:Carlin:Cariban-Mawayana**). See also: Mapidian-Mawayana [mpw].
