comment = **hh:vw:Boyd:Lemboka** presents the first data and discussion on the language **hh:hvb:vanBulck:Congo**:631 identified as BaOnde-YaNgonde-Lioto. **hh:vw:Boyd:Lemboka** calls it Lemboka and shows that it is a different language from the neighbouring Ngelima [agh], So [soc] and Poke [pof], though most closely related to So. It is missing from E16/E17/E18/E19/E20/E21/E22/E23/E24/E25/E26/E27/E28/E29. See also: Ngelima [agh], Poke [pof], So (Democratic Republic of Congo) [soc].
