[hh_ethnologue_comment]
comment = Karara is the name of an Arawakan group from the upper Jatapu river in Amazonas state, Brazil (**hh:hv:Frikel:Para**). **hh:e:Brasolin:Hexkaryana** met with the remnants of this group living with the Hixkaryana and realized that there is still a fluent speaker and her semi-speaker daughter (and perhaps others living in volountary isolation). The language is a close relative (or even descendant) of Aroaqui and Parauana of the Pidjanan subgroup of Arawakan (**hh:vw:Nikulin:Karara**), but perhaps different enough to be a different language. It is missing from E16/E17/E18/E19/E20/E21/E22/E23/E24/E25/E26/E27/E28/E29.
