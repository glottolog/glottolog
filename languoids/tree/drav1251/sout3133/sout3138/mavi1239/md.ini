[hh_ethnologue_comment]
comment = Mavilan is a Dravidian people of Kerala long assumed to speack Tulu [tcy] (**hh:he:Luiz:Kerala**). However, the language has recently been surveyed and comparison of linguistic data shows it to be an independent South Dravidian I language (**hh:ld:Vasudevan:Markodi:2016**, **hh:ld:Vasudevan:Markodi**, **hh:wsoc:Canvin:Mavilan**). The language in missing from E16/E17/E18/E19/E20/E21/E22/E23/E24/E25/E26/E27/E28/E29. See also: Tulu [tcy].
